<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="assets/fav.ico" rel="icon">
    <title>TinyGraphics.js</title>
    <style>
        body { margin: 0; padding: 12px 16px 40px; background: #fafaf8; color: #1d1d1f;
            font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        header { max-width: 1080px; margin: 0 auto 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
        header h1 { font-size: 17px; margin: 0; }
        header select { font: inherit; padding: 3px 4px; }
        header p { flex-basis: 100%; margin: 0; color: #6b6b70; }
        header a { color: #2f6fdd; }
    </style>
</head>
<body>
<header>
    <h1>TinyGraphics.js</h1>
    <label>Scene <select id="scene-picker"><option value="">Main_Scene (your main-scene.js)</option></select></label>
    <p id="teaches">Pick an example, or edit <code>main-scene.js</code> and reload.
        <a href="https://github.com/intro-graphics/TinyGraphics.js/tree/v2/docs">Docs</a></p>
</header>
<div id="main-canvas"></div>
<script type="module">
    import {tiny, defs} from './common.js';
    import {examples} from './examples/index.js';
    import {Main_Scene} from './main-scene.js';

    // ?scene=Name selects an example; no parameter shows your own Main_Scene.
    const requested = new URLSearchParams(location.search).get("scene");
    const picker = document.getElementById("scene-picker");
    for (const name of Object.keys(examples))
        picker.appendChild(Object.assign(document.createElement("option"), {value: name, textContent: name}));
    picker.value = requested && examples[requested] ? requested : "";
    picker.addEventListener("change", () => {
        const url = new URL(location.href);
        if (picker.value) url.searchParams.set("scene", picker.value); else url.searchParams.delete("scene");
        location.href = url.href;
    });

    const entry = examples[requested];
    if (requested && !entry) document.getElementById("teaches").textContent = `No example named "${requested}".`;
    if (entry) document.getElementById("teaches").textContent = entry.teaches;
    const Scene_Class = entry ? entry.scene : Main_Scene;
    new tiny.Canvas_Widget(document.getElementById("main-canvas"), [new Scene_Class()],
        {make_code_nav: true, definitions: defs});
</script>
</body>
</html>
