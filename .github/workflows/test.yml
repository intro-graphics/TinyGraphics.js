name: test
on:
  push:
  pull_request:
jobs:
  math:
    # Browser rendering checks (npm run check) need a working GPU and run locally; see README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-math.mjs
